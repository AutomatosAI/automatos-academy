# Content validate (PRD-U3) — the gate in front of the boot-time publish.
#
# This workflow NO LONGER PUBLISHES. Since 2026-10-19 the course content is
# published into Postgres by docker-entrypoint.sh on every Railway deploy
# (CONTENT_SOURCE=db), on the service's private DATABASE_URL. Production
# Postgres is not reachable from GitHub Actions: the old publish job here
# failed on every content merge after 19 Aug 2026.
#
# What it does now: run exactly what the boot-time publish runs, minus the
# database write, so a content PR that would fail the publish fails here
# first:
#   1. `npm run validate` — the content gate;
#   2. `npm run publish-content -- --dry-run` — the same validate + index
#      build + version roll-up the deploy runs, with no DATABASE_URL.
# Dependencies install the way the Dockerfile installs them (--omit=dev), so
# a publish path that needs a dev-only package goes red here too.
#
# Manual publish lane (production, inside Railway; it re-runs the publish of
# the running image's tree, so it helps after a transient database error at
# boot; a content fix needs a new deploy, which publishes on boot):
#   railway ssh --service automatos-academy -- "npm run publish-content"
#
# No secrets, no database: this job must never be given DATABASE_URL again.
name: content-validate

on:
  pull_request:
    paths:
      - "public/content/**"
      - "scripts/publish-content.mjs"
      - "scripts/validate-content.mjs"
      # Every module in the publish's import graph (tests/deploy-lane.test.mjs
      # fails when one is missing here).
      - "server/catalog.js"
      - "server/podcasts.js"
      - "server/content/**"
      - "server/cards/**"
      - "server/concepts/**"
      - "server/media/**"
      - "docker-entrypoint.sh"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/content-publish.yml"
  push:
    branches: [main]
    paths:
      - "public/content/**"
  workflow_dispatch:

concurrency:
  group: content-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate content (publish dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm run validate
      - run: npm run publish-content -- --dry-run
